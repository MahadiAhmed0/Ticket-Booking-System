server:
  port: 9002
  tomcat:
    max-http-request-header-size: 32KB

spring:
  application:
    name: USER-SERVICE
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/users_db}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ticket-booking-system-swe4602-secret-key-2026
  expiration-ms: 3600000
