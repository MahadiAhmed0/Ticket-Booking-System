server:
  port: 9004
  tomcat:
    max-http-request-header-size: 32KB

spring:
  application:
    name: BOOKING-SERVICE
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/bookings_db}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
