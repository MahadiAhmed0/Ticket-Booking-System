server:
  port: 9003
  tomcat:
    max-http-request-header-size: 32KB

spring:
  application:
    name: EVENT-SERVICE
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/events_db}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
