services:

  # Database-per-Service: each service owns its own MongoDB instance
  mongo-users:
    image: mongo:7
    container_name: mongo-users
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-events:
    image: mongo:7
    container_name: mongo-events
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-bookings:
    image: mongo:7
    container_name: mongo-bookings
    ports:
      - "27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-payments:
    image: mongo:7
    container_name: mongo-payments
    ports:
      - "27020:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "9002:9002"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      MONGO_URI: mongodb://mongo-users:27017/users_db
    depends_on:
      mongo-users:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  event-service:
    build: ./event-service
    container_name: event-service
    ports:
      - "9003:9003"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      MONGO_URI: mongodb://mongo-events:27017/events_db
    depends_on:
      mongo-events:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "9004:9004"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      MONGO_URI: mongodb://mongo-bookings:27017/bookings_db
      RABBIT_HOST: rabbitmq
    depends_on:
      mongo-bookings:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "9005:9005"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      MONGO_URI: mongodb://mongo-payments:27017/payments_db
      RABBIT_HOST: rabbitmq
    depends_on:
      mongo-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "9006:9006"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      RABBIT_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_started
    restart: on-failure

  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway

  frontend-app:
    image: nginx:alpine
    container_name: frontend-app
    ports:
      - "3001:80"
    volumes:
      - ./frontend-app:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway

  frontend-admin:
    image: nginx:alpine
    container_name: frontend-admin
    ports:
      - "3002:80"
    volumes:
      - ./frontend-admin:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
